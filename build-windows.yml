name: Build Windows exe
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile with MinGW g++
        shell: bash
        run: |
          mkdir -p Windows_Build
          g++ -std=c++17 -Wall -Wextra -static -o Windows_Build/household.exe src/*.cpp
      - uses: actions/upload-artifact@v4
        with:
          name: household-windows-exe
          path: Windows_Build/household.exe
